# The offline hand, played end to end against the web build:
# deal → real betting rounds to the river → a hero BET → §19's window opens → build a word
# from the rack → confirm → §11 judges it against the real dictionary → §21 names a winner →
# the results → DEAL ANOTHER → the next hand.
#
# Run it with the CLI (headed by default; add `--headless` to hide the browser):
#   maestro test --platform web .maestro/offline-hand.yaml
#
# `url:` (not `appId:`) because this is a web flow: Maestro drives Chrome through the
# chromedriver it finds on PATH, so that driver has to match the installed Chrome.
#
# Two things this CLI is picky about, both learned the hard way:
#   - Selector commands take the mapping form (`- tapOn:\n    text: …`); the bare scalar
#     form (`- tapOn: "…"`) is a parse error, whatever the cheat sheet's examples show.
#   - Match elements with `id:` — the values the hierarchy exposes (a view's test id, or
#     an element's accessibility label). A `css:` selector never settles on this page and
#     the step hangs without failing.
#
# Where a control has a test id, `id:` is that test id on the web too: the app keeps the DOM
# element's own id in step with `testID` (`webTestID` in src/lib/web-id.ts), because Maestro
# reads the DOM id before the aria-label and the label would otherwise hide the test id from
# this flow. Labels are for the elements that have no test id at all.
#
# The route sits behind the app's auth guard. A headed run keeps a signed-in
# session in Maestro's Chrome profile (sign in once — via sign-in.yaml — then
# rerun); a headless run starts every time on a fresh profile, so the flow
# signs itself in when the guard bounces it: the seeded E2E user lives in
# Postgres (scripts/seed-test-user.mjs; see sign-in.yaml for the recipe).
# `guard={true}` on the (tabs) group in apps/mobile/src/app/_layout.tsx remains
# the dev-only way to reach the table with no account at all.
# A table draws its own seed when the URL pins none, and a drawn hand is not a hand this
# flow can name the tiles of — the deal below taps them by id. `?seed=` pins it: the tiles
# the flow plays are the ones that hand holds, and every run plays the same hand.
#
# The CPU plays on a beat of its own (one seat's action per `duration.cpuBeat`), so the table
# between two hero actions moves on its own: every step that waits for a bot — the opening
# bet, the answers to the hero's bet, the window's close — waits for it rather than asserts it
# on the spot, and the round's walk waits for the hero's own turn instead of tapping the row
# while a bot holds it.
#
# The pinned seed's personality-policy line (also asserted by game-rules/test/bot.test.ts):
# mira raises preflop to 40, called around; the flop checks through. On the turn Mira bets
# 100, the hero and Ellis call, and Jay folds. The river checks to the hero with pot 460.
# The hero opens for 20, Ellis calls, Mira raises to 480, and the hero calls the remaining 460.
# Ellis calls the raise too; pot 1,900 opens the word window. The hero's Z/A tiles are unchanged.
#
# The felt reaches its row by `id:` rather than by text. Its controls carry test ids
# (`action-check-call` walks the round and, inside §19's window, is the confirm), because the
# seat nameplates print CHECK and CALL as status too and a text selector for a control can
# land on a seat instead — see the selector note in the native flow.
url: http://localhost:8081/offline?seed=7578
name: Offline hand — bet, build a word and pay out
tags:
  - web
  - offline
---
- openLink: http://localhost:8081/offline?seed=7578

# If the guard bounced a fresh profile to the sign-in screen, sign in as the
# E2E user and come back to the table. The wait is optional: a profile that is
# already signed in goes straight to the table and skips the subflow.
- extendedWaitUntil:
    visible: "TAKE YOUR SEAT"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "TAKE YOUR SEAT"
    file: sign-in.yaml
- openLink: http://localhost:8081/offline?seed=7578

# The table holds until the dictionary has loaded (the hand is judged against it).
- extendedWaitUntil:
    visible: "PREFLOP"
    timeout: 90000
- assertVisible:
    text: "COMMUNITY · 0/5"

# The blinds are posted before the deal, and the seat clockwise from the big blind opens the
# round a beat later: mira raises the blind to 40, and the row states the call that leaves the
# hero owing — the engine's number, not a placeholder. The control prints its label and its
# amount as two nodes, so a selector reaches the amount through the control's own test id
# (`containsDescendants`) rather than through text that reads "CALL $40" in one piece. This is the
# seed's line, so a changed seed or table configuration fails here, loudly.
- extendedWaitUntil:
    visible:
      id: "action-check-call"
      containsDescendants:
        - text: "\\$40"
    timeout: 20000

# Play the hero's turns to the river. Each pass waits for the hero to hold the table — the
# seat's own nameplate says so, and the wait also ends when the street turns past the hero — so
# the loop paces itself against the CPU's beats instead of spinning on a dead row. The control
# it taps is the row's check-or-call, which is named after the bot line the engine answered, and
# which §19's window turns into the confirm.
- repeat:
    while:
      notVisible:
        text: "RIVER"
    commands:
      - extendedWaitUntil:
          visible: "YOUR TURN|RIVER"
          timeout: 40000
          optional: true
      - runFlow:
          when:
            visible: "YOUR TURN"
          commands:
            - tapOn:
                id: "action-check-call"
            - waitForAnimationToEnd

# The hero can open the river. Mira answers with a raise: call it before building the word.
- extendedWaitUntil:
    visible: "YOUR TURN"
    timeout: 20000
# Select the minimum opening bet; the combined button defaults to Check.
- tapOn:
    id: "wager-slider"
    point: "2%,50%"
- assertVisible:
    id: "action-wager"
    containsDescendants:
      - text: "\\$20"
- assertVisible:
    text: "\\$460"
- tapOn:
    id: "action-wager"
- extendedWaitUntil:
    visible:
      id: "action-check-call"
      containsDescendants:
        - text: "\\$460"
    timeout: 20000
- tapOn:
    id: "action-check-call"
- extendedWaitUntil:
    visible: "\\$1,900"
    timeout: 20000
- assertNotVisible:
    id: "action-wager"
    containsDescendants:
      - text: "\\$20"
- assertVisible:
    text: "FINAL STAGE · SUBMIT YOUR WORD"
- assertVisible:
    text: "Shared submission deadline.*"
- assertNotVisible:
    id: "action-fold"
- assertNotVisible:
    id: "all-in-button"

# The river's close opened §19's window: the band under the felt — the draft line and the
# strip of tiles the seat sorts — is what the flow builds its word through. The HUD names
# the final stage while the gameplay phase stays river.
#
# Build the word out of three tiles the strip holds for this seed. The strip's tiles carry test
# ids and the felt's copies of them carry none — those draw the state alone — so by its id a tap
# can only land in the strip. A tap toggles a tile where it lies, so the word is the played
# tiles read left to right, not the order they were tapped: Z-1, I-9 and G-1 sit in that
# order in this deal's strip, and the draft spells ZIG.
#
# Those three are the deal's own for the seed the URL pins — Z-1, I-9 and G-1 — so a
# changed seed or table configuration fails here, loudly, instead of silently playing some other
# word; their word is 14 points.
- tapOn:
    id: "word-builder-tile-Z-1"
- tapOn:
    id: "word-builder-tile-I-9"
- tapOn:
    id: "word-builder-tile-G-1"
- assertVisible:
    text: "ZIG"
- assertVisible:
    text: "14 pts"

# Shuffling rearranges the tiles the word does not hold, so the draft the seat has built stands
# exactly as it was — which is the whole point of shuffling while a word is being built. The
# icon button carries no text, so it is reached by the same test id a device flow uses.
- tapOn:
    id: "word-builder-shuffle"
- assertVisible:
    text: "ZIG"
- assertVisible:
    text: "14 pts"

# Submit once, then let the remaining seats answer on the shared clock.
- assertVisible:
    text: "SUBMIT WORD"
- tapOn:
    id: "action-check-call"

# Every seat has answered, so the window closes and the hand pays out on the real judging:
# immediately when the bots found words, or on the window's clock when they did not.
- extendedWaitUntil:
    visible: "PAYOUT"
    timeout: 70000
- assertVisible:
    text: "WINNER"

# The payout of the hand is the results, presented over the felt: this hand's number, its pot
# counted up, every seat that reached the reveal, and the rating card under the scoreboard.
# The table's own Deal is gone — the results' primary is the only deal left on the table.
- extendedWaitUntil:
    visible: "HAND #1 · RESULTS"
    timeout: 5000
- assertVisible:
    text: "SCOREBOARD"
- assertVisible:
    text: ".*WORDS PLAYED.*"
- assertVisible:
    text: "DEAL ANOTHER"
# The seat confirmed its word inside §19's window, so its own card carries that submission rather
# than the window's timeout: the confirm and the payoff are the same word.
- assertNotVisible:
    text: "The window closed"

# The primary is inert until the entrance settles; the tap retries until it takes, then the
# next hand is dealt and nothing of the results is left behind.
- waitForAnimationToEnd
- tapOn:
    text: "DEAL ANOTHER"
- assertVisible:
    text: "PREFLOP"
- assertVisible:
    text: "COMMUNITY · 0/5"
- assertNotVisible:
    text: "HAND #1 · RESULTS"

# The online lobby, driven end to end against the web build (STO-389): the list of open tables,
# a table created through the real form, the seated screen it lands on, joining from the list,
# the live seat counts that come back from a leave, and both forms of a link that opens a table
# directly.
#
#   pnpm dev:server                                # the Colyseus server on 2567
#   pnpm start:local                               # Expo with local API and game, web on 8081
#   pnpm seed:test-users                           # if the password stopped working
#   maestro test --platform web .maestro/online-lobby.yaml
#
# `-e WEB_URL=http://<lan-ip>:<port>` points the flow at another Expo. Better Auth trusts
# localhost:8081 and 192.168.*.* on any port, so a second Metro beside a running one is reached
# through the LAN address.
#
# One table has to exist before the flow starts, or there is nothing to join from the list — and a
# browser cannot be both the player at a table and the one browsing it.
# `apps/server/scripts/hold-table.ts` is that other player: it signs in as e2e-2, creates "Node
# Table" (500 coins, 2 seats) and holds its seat until it is stopped, which is what the "1 of 2
# seats taken" assertions below count. Run it beside the two servers (AUTH_API_URL is the Expo):
#
#   pnpm --filter @wordpoker/server exec tsx scripts/hold-table.ts
#
# The flow leaves every seat it takes, and an empty table disposes itself, so nothing is left
# behind but the holder's table.
#
# Selector notes are sign-in.yaml's: commands take the mapping form, elements match by `text:` or
# `id:` — a view's test id or an element's accessibility label — and web text matching folds case.
url: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}/online"
name: Online lobby — create a table, sit down, leave
tags:
  - web
  - online
---
- evalScript: "${output.web = typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}"
- openLink: ${output.web}/online

# A fresh profile arriving at the lobby is seated as a guest (STO-581), and a guest gets the
# account panel rather than a Join (STO-953) — so the sign-in always runs. It signs out whatever
# session the profile holds first, guest or not.
- runFlow: sign-in.yaml
- openLink: ${output.web}/online

# The list is the server's own listing, subscribed live. The holder's table is in it with the one
# seat it holds — as the hero card when it is the only table, so the seat count is read off the
# card's spoken sentence (spokenTable in parlor-view.ts), which rows and card share.
#
# The anchor is the docked "+ DEAL A NEW TABLE": the parlour is a page, and at a phone's height the
# rooms heading sits below the fold, but the dock is on screen at every window size.
- extendedWaitUntil:
    visible: ".*DEAL A NEW TABLE"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: ".*Join Node Table, .*1 of 2 seats taken.*"
    timeout: 30000
# Design 1a's price tag (STO-952): the button says what sitting down costs, and the Wallet the
# lobby read is in the sentence a screen reader gets.
- assertVisible:
    id: "Join Node Table for 500 coins\\..*"

# Create a table through the form. The defaults are §2's first buy-in (500 coins) and §5's cap
# (6 seats), so the flow only names it. The button that opens it is the parlour's floating deal,
# and the submit quotes the buy-in it costs.
- tapOn:
    text: ".*DEAL A NEW TABLE"
- tapOn:
    id: "Table name"
- inputText: "Maestro Table"
- tapOn:
    text: "CREATE · 500"

# The creator lands seated at the table they made, and the felt is the table from the moment the
# seat is taken: this player's place on it with the fixed buy-in as its stack (the seat pill reads
# "YOU · 500"), the waiting state,
# and §5's ready check where the betting row will be — nobody else is seated, so nothing deals.
# The felt does not print the table's name; the lobby checks below are what tie it to this table.
- extendedWaitUntil:
    visible:
      id: "poker-table"
    timeout: 30000
- assertVisible:
    text: "YOU · 500"
- assertVisible:
    text: "WAITING"
- assertVisible:
    text: "I'M READY"

# Leave through the felt's HUD control: the seat goes, and with the last of them the table
# disposes — the lobby's live subscription drops the row rather than leaving a table nobody can
# sit at.
- tapOn:
    id: "hud-leave-button"
- extendedWaitUntil:
    visible: ".*DEAL A NEW TABLE"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      text: "Maestro Table"
    timeout: 15000

# Join from the hero card: its price-tag Join takes the free seat in one tap (design 1a — a row
# opens the details sheet first, the card's button does not).
#
# The join lands on the felt. Nothing deals until every seated player says ready (§5), so the
# table sits in its waiting room. A felt does not print the table's name, so what proves the seat
# was taken is the felt's own: this player's place on it.
- tapOn:
    id: "Join Node Table for 500 coins\\..*"
- extendedWaitUntil:
    visible:
      id: "poker-table"
    timeout: 30000
- assertVisible:
    text: "YOU · .*"

# And back out through the felt's own leave control — the one in the HUD, which has no label to
# read on the felt. The seat goes, the table is down to the holder's, and the lobby shows it open
# again. The count is the server's own, pushed when the seat went — so this waits rather than
# samples.
- tapOn:
    id: "hud-leave-button"
- extendedWaitUntil:
    visible:
      id: ".*Join Node Table, .*1 of 2 seats taken.*"
    timeout: 30000

# A link that names a table lands on that table's own screen rather than on the lobby — in both
# forms the app deals with. The table both name is gone, which is the other half of STO-401: the
# seat cannot be taken, so the screen says so and offers the way back instead of sitting on
# "taking your seat". (This drives the signed-in arrival; a link that arrives before there is a
# session to take it is `pending-destination`'s own unit suite.)
- openLink: ${output.web}/online?room=no-such-table
- extendedWaitUntil:
    visible:
      text: "ONLINE TABLE"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "That table is full or has just closed."
    timeout: 30000
- tapOn:
    text: "Back to lobby"
- extendedWaitUntil:
    visible: ".*DEAL A NEW TABLE"
    timeout: 30000

# The form the app writes itself: routing to a table leaves `/online/<roomId>` in the address bar,
# so this is what a reload of the seated screen, a bookmark and a shared URL arrive as.
- openLink: ${output.web}/online/no-such-table
- extendedWaitUntil:
    visible:
      text: "That table is full or has just closed."
    timeout: 30000
- tapOn:
    text: "Back to lobby"
- extendedWaitUntil:
    visible: ".*DEAL A NEW TABLE"
    timeout: 30000

# Run against Expo web with the seeded E2E account.
url: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}"
name: Home, Friends, and Game History bottom navigation
tags:
  - web
  - navigation
---
- runFlow: sign-in.yaml
- assertVisible:
    id: "tab-home"
- tapOn:
    id: "tab-friends"
- extendedWaitUntil:
    visible:
      id: "friends-screen"
    timeout: 30000
- assertVisible:
    id: "tab-home"
- tapOn:
    id: "tab-history"
- extendedWaitUntil:
    visible:
      id: "history-screen"
    timeout: 30000
- tapOn:
    id: "tab-home"
- assertVisible: "Offline"
# Direct links must land inside the same tab bar.
- openLink: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}/friends"
- extendedWaitUntil:
    visible:
      id: "friends-screen"
    timeout: 30000
- tapOn:
    id: "tab-home"
- assertVisible: "Offline"
- openLink: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}/history"
- extendedWaitUntil:
    visible:
      id: "history-screen"
    timeout: 30000
- tapOn:
    id: "tab-home"
- assertVisible: "Offline"

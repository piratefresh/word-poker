# Start with pnpm dev:history and pnpm start:local. Requires the seeded E2E accounts.
url: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}"
name: Completed offline hand appears in durable history
tags:
  - web
  - history
---
- runFlow: offline-hand.yaml
- openLink: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}/history"
- extendedWaitUntil:
    visible:
      id: "View session .*"
    timeout: 30000
- tapOn:
    id: "View session .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "Hand [0-9]+,.*"
    timeout: 30000
- tapOn:
    id: "Hand [0-9]+,.*"
    index: 0
- assertVisible: "HAND #1"
- assertVisible:
    text: "VERIFIED · UNRANKED|ON DEVICE · UNRANKED"
- scrollUntilVisible:
    element:
      text: "ACTION LOG"
    direction: DOWN
    timeout: 10000
- assertVisible: "ACTION LOG"

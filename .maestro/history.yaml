# Start with pnpm dev:history and pnpm start:local. Requires the seeded E2E accounts.
url: http://localhost:8081
name: Completed offline hand appears in durable history
tags:
  - web
  - history
---
- runFlow: offline-hand.yaml
- openLink: http://localhost:8081/history
- extendedWaitUntil:
    visible: "View session .*"
    timeout: 30000
- tapOn:
    text: "View session .*"
    index: 0
- extendedWaitUntil:
    visible: "Hand [0-9]+,.*"
    timeout: 30000
- tapOn:
    text: "Hand [0-9]+,.*"
    index: 0
- assertVisible: "HAND #1"
- assertVisible:
    text: "VERIFIED · UNRANKED|ON DEVICE · UNRANKED"
- scrollUntilVisible:
    element:
      text: "ACTION LOG"
    direction: DOWN
    timeout: 10000
- assertVisible: "ACTION LOG"

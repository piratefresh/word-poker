url: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}"
name: Account sheet opens, arms delete only on DELETE, closes with DONE
tags: [web, settings]
---
# STO-1044: the Account sheet autosaves, so it has DONE and no Save/Cancel. This flow changes
# nothing: it types into the delete confirmation and backs out with KEEP IT. Inputs go by their
# label: on the web the aria-label hides the test id from Maestro, and Maestro web
# reads no disabled state, so the native flow checks that DELETE arms the button.
- runFlow: sign-in.yaml
- tapOn:
    id: "home-account-menu"
- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      id: "account-settings"
    timeout: 10000
- assertVisible: "Account"
- assertVisible: "Signed in with email"
- assertVisible:
    id: "Display name"
- assertVisible: "Sign-in"
- takeScreenshot: settings-account-sheet
- scrollUntilVisible:
    element:
      id: "account-delete"
- tapOn:
    id: "account-delete"
- assertVisible: "Delete your account?"
- assertVisible:
    id: "Delete my account"
- tapOn:
    id: "Type DELETE to confirm"
- inputText: "DELETE"
- assertVisible:
    id: "Delete my account"
- takeScreenshot: settings-delete-armed
- tapOn:
    id: "delete-account-back"
- assertNotVisible:
    id: "delete-account"
- scrollUntilVisible:
    element:
      id: "account-done"
    direction: UP
- tapOn:
    id: "account-done"
- extendedWaitUntil:
    notVisible:
      id: "account-settings"
    timeout: 10000
- assertVisible: "Offline"

# Subflow: sign in when this browser's fresh profile is bounced to the guard, then open the lobby.
# The pattern is online-hand.yaml's; every seat runs in its own temporary Chrome profile.
url: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}/online"
name: Four-seat - sign in and open the lobby
---
- runFlow: ../sign-in.yaml
- openLink: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}/online"
- extendedWaitUntil:
    visible: ".*DEAL A NEW TABLE"
    timeout: 30000

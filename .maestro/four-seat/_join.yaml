# Subflow (P2-P4): join the exact room the runner read off the lobby watcher.
url: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}/online"
name: Four-seat - join by room id
---
- openLink: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}/online/${ROOM_ID}"
- extendedWaitUntil:
    visible:
      id: "poker-table"
    timeout: 30000
- assertVisible:
    text: "YOU · .*"

# Subflow: the barrier. Wait until SEATS seats are at the table, then say ready. Nothing deals
# until every seated browser has done the same.
url: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}/online"
name: Four-seat - ready up
---
- extendedWaitUntil:
    visible: "[0-9] of ${SEATS} ready.*"
    timeout: 600000
- tapOn:
    id: "action-ready"
- extendedWaitUntil:
    visible: "PREFLOP( [1-5]/5)?"
    timeout: 180000

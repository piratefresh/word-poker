# The four-browser online smoke, seat P1 (STO-483). Run all four with `pnpm smoke:online:four`;
# the runner starts the servers, launches the seats one at a time so join order is seat order,
# and passes P2-P4 the ROOM_ID P1's table was given.
#
# Script: apps/server/scripts/four-seat-scenario.ts. Re-probe the seed and the taps below with
#
#   pnpm --filter @wordpoker/server exec tsx scripts/probe-four-seat.ts
#
# Probe for seed 98 (WORDPOKER_SMOKE_ROOM supplies it; 500 buy-in, blinds 5/10):
#   Hand 1  board A R E/I Y F     P1 I D (folds)   P2 J/H R/N -> JAY 14   P3 A N -> NARY 10
#           P4 E A -> ERY 8       P2 wins; pot 120; stacks 500 / 580 / 460 / 460
#   Hand 2  board N I D A A/I     P1 S S -> NIDI 7   P2 H E -> HEIDI 16   P3 O Q -> QI 11
#           P4 D/T Z (folds)      P2 wins; pots 40 + 1350 + side 20; P3 busts
#   Hand 3  board I E L E/I U     P1 A C -> ACLU 10   P2 X N -> XL 12   P4 D Z/X -> DZ 16
#           P3 sits out and leaves; P4 wins; the leave returns the table to waiting
#   Hand 4  P1, P2 and P4 ready again and the table deals 3-handed.
#
# Words are tapped in strip order (rack, then board): a tap never moves a tile. Tiles are taken by
# their strip test ids (word-builder-tile-<id>); a choice tile by its face chip alone
# (word-builder-face-<id>-<face>), which plays the tile on that face.
url: http://localhost:8081/online
name: Four-seat P1 - creates the table, folds, calls a shove, plays 3-handed
tags:
  - web
  - online
  - four-seat
---
- runFlow: _sign-in-and-open.yaml
- runFlow: _create.yaml
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 1: the button folds to P4's raise and watches.
- runFlow:
    file: _act.yaml
    env: { ACTION: fold }
- runFlow:
    file: _results.yaml
    env: { HAND: "1", WORD: JAY }
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 2: limp, call P3's shove, bet the flop into the side pot, check it down, spell NIDI.
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: wager }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow: _river.yaml
- tapOn:
    id: "word-builder-tile-N-1"
- tapOn:
    id: "word-builder-tile-I-6"
- tapOn:
    id: "word-builder-tile-D-4"
- tapOn:
    id: "word-builder-face-AI-1-I"
- runFlow:
    file: _confirm.yaml
    env: { HAND: "2", WORD: NIDI }
- runFlow:
    file: _results.yaml
    env: { HAND: "2", WORD: HEIDI }
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 3: the small blind completes, checks it down, spells ACLU.
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow: _river.yaml
- tapOn:
    id: "word-builder-tile-A-6"
- tapOn:
    id: "word-builder-tile-C-1"
- tapOn:
    id: "word-builder-tile-L-1"
- tapOn:
    id: "word-builder-tile-U-1"
- runFlow:
    file: _confirm.yaml
    env: { HAND: "3", WORD: ACLU }
- runFlow:
    file: _results.yaml
    env: { HAND: "3", WORD: DZ }

# P3 left: back to the waiting room, the three seats ready up, and hand 4 deals 3-handed.
- runFlow:
    file: _ready.yaml
    env: { SEATS: "3" }
- tapOn:
    id: "Leave the table"
- extendedWaitUntil:
    visible: "Deal a new table"
    timeout: 30000

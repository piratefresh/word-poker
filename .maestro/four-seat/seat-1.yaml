# The four-browser online smoke, seat P1 (STO-483). Run all four with `pnpm smoke:online:four`;
# the runner starts the servers, launches the seats one at a time so join order is seat order,
# and passes P2-P4 the ROOM_ID P1's table was given.
#
# Script: apps/server/scripts/four-seat-scenario.ts. Re-probe the seed and the taps below with
#
#   pnpm --filter @wordpoker/server exec tsx scripts/probe-four-seat.ts
#
# Probe for seed 4111 (WORDPOKER_SMOKE_ROOM supplies it; 500 buy-in, blinds 5/10):
#   Hand 1  board A/I L E A A     P1 R U (folds)   P2 D/T X -> DX 11   P3 Y I -> YALE 9
#           P4 O A -> ILEA 5      P2 wins; pot 120; stacks 500 / 580 / 460 / 460
#   Hand 2  board A X D R O/U     P1 R R/N -> RX 12   P2 T O -> TAX 13   P3 K A/I -> AX 10
#           P4 T D (folds)        P2 wins; pots 40 + 1350 + side 20; P3 busts
#   Hand 3  board E/I A L I K     P1 A R -> ARAK 9   P2 T/S W -> TWEAK 16   P4 G C -> CALK 12
#           P3 sits out and leaves; P2 wins; the leave returns the table to waiting
#   Hand 4  P1, P2 and P4 ready again and the table deals 3-handed.
#
# Words are tapped in strip order (rack, then board): a tap never moves a tile. Tiles are taken by
# their strip test ids (word-builder-tile-<id>); a choice tile by its face chip alone
# (word-builder-face-<id>-<face>), which plays the tile on that face.
url: http://localhost:8081/online
name: Four-seat P1 - creates the table, folds, calls a shove, plays 3-handed
tags:
  - web
  - online
  - four-seat
---
- runFlow: _sign-in-and-open.yaml
- runFlow: _create.yaml
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 1: the button folds to P4's raise and watches.
- runFlow:
    file: _act.yaml
    env: { ACTION: fold }
- runFlow:
    file: _results.yaml
    env: { HAND: "1", WORD: DX }

# Hand 2: limp, call P3's shove, bet the flop into the side pot, check it down, spell RX.
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: wager }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow: _river.yaml
- tapOn:
    id: "word-builder-face-RN-1-R"
- tapOn:
    id: "word-builder-tile-X-1"
- runFlow:
    file: _confirm.yaml
    env: { HAND: "2", WORD: RX }
- runFlow:
    file: _results.yaml
    env: { HAND: "2", WORD: TAX }

# Hand 3: the small blind completes, checks it down, spells ARAK.
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow: _river.yaml
- tapOn:
    id: "word-builder-tile-A-7"
- tapOn:
    id: "word-builder-tile-R-4"
- tapOn:
    id: "word-builder-tile-A-9"
- tapOn:
    id: "word-builder-tile-K-1"
- runFlow:
    file: _confirm.yaml
    env: { HAND: "3", WORD: ARAK }
- runFlow:
    file: _results.yaml
    env: { HAND: "3", WORD: TWEAK }

# P3 left: back to the waiting room, the three seats ready up, and hand 4 deals 3-handed.
- runFlow:
    file: _ready.yaml
    env: { SEATS: "3" }
- tapOn:
    id: "Leave the table"
- extendedWaitUntil:
    visible: "Deal a new table"
    timeout: 30000

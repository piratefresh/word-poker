# Subflow: read hand HAND's results, check the winning WORD is on the scoreboard, and put the
# overlay away. Each player then readies up before the next hand.
#
# The wait is long on purpose: four browsers play one table, one seat at a time, and a hand runs
# its four streets through all of them before it pays out — a street costs the room whole seconds
# per seat, so a hand that takes three minutes is the smoke working, not stalling.
url: http://localhost:8081/online
name: Four-seat - results
---
- extendedWaitUntil:
    visible: "HAND #${HAND} · RESULTS"
    timeout: 300000
- assertVisible:
    text: "SCOREBOARD"
- assertVisible:
    text: ".*${WORD}.*"
- tapOn:
    id: "Play another hand, [0-9]+ of [0-9]+ players want to play again"
- waitForAnimationToEnd

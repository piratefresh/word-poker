# The four-browser online smoke, seat P4 (STO-483). Seed, racks and taps: the header of seat-1.yaml.
url: http://localhost:8081/online
name: Four-seat P4 - opens with a raise, folds to the shove, plays 3-handed
tags:
  - web
  - online
  - four-seat
---
- runFlow: _sign-in-and-open.yaml
- runFlow: _join.yaml
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 1: under the gun raises, calls P2's re-raise and flop bet, checks it down, spells ERY.
- runFlow:
    file: _act.yaml
    env: { ACTION: wager }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow: _river.yaml
- tapOn:
    id: "word-builder-tile-E-5"
- tapOn:
    id: "word-builder-tile-R-3"
- tapOn:
    id: "word-builder-tile-Y-2"
- runFlow:
    file: _confirm.yaml
    env: { HAND: "1", WORD: ERY }
- runFlow:
    file: _results.yaml
    env: { HAND: "1", WORD: JAY }
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 2: the big blind folds to P3's shove.
- runFlow:
    file: _act.yaml
    env: { ACTION: fold }
- runFlow:
    file: _results.yaml
    env: { HAND: "2", WORD: HEIDI }
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 3: the button limps, checks it down, spells DZ.
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow: _river.yaml
- tapOn:
    id: "word-builder-tile-D-4"
- tapOn:
    id: "word-builder-face-ZX-1-Z"
- runFlow:
    file: _confirm.yaml
    env: { HAND: "3", WORD: DZ }
- runFlow:
    file: _results.yaml
    env: { HAND: "3", WORD: DZ }

- runFlow:
    file: _ready.yaml
    env: { SEATS: "3" }
- tapOn:
    id: "Leave the table"
- extendedWaitUntil:
    visible: "Deal a new table"
    timeout: 30000

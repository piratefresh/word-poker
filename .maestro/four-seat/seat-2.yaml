# The four-browser online smoke, seat P2 (STO-483). Seed, racks and taps: the header of seat-1.yaml.
url: http://localhost:8081/online
name: Four-seat P2 - re-raises and wins, wins the side pot, plays 3-handed
tags:
  - web
  - online
  - four-seat
---
- runFlow: _sign-in-and-open.yaml
- runFlow: _join.yaml
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 1: the small blind re-raises P4, bets the flop, checks it down, spells JAY and wins.
- runFlow:
    file: _act.yaml
    env: { ACTION: wager }
- runFlow:
    file: _act.yaml
    env: { ACTION: wager }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow: _river.yaml
- tapOn:
    id: "word-builder-face-JH-1-J"
- tapOn:
    id: "word-builder-tile-A-4"
- tapOn:
    id: "word-builder-tile-Y-2"
- runFlow:
    file: _confirm.yaml
    env: { HAND: "1", WORD: JAY }
- runFlow:
    file: _results.yaml
    env: { HAND: "1", WORD: JAY }
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 2: the button limps, calls the shove and P1's flop bet, checks it down, spells HEIDI.
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow: _river.yaml
- tapOn:
    id: "word-builder-tile-H-2"
- tapOn:
    id: "word-builder-tile-E-2"
- tapOn:
    id: "word-builder-tile-I-6"
- tapOn:
    id: "word-builder-tile-D-4"
- tapOn:
    id: "word-builder-face-AI-1-I"
- runFlow:
    file: _confirm.yaml
    env: { HAND: "2", WORD: HEIDI }
- runFlow:
    file: _results.yaml
    env: { HAND: "2", WORD: HEIDI }
- runFlow:
    file: _ready.yaml
    env: { SEATS: "4" }

# Hand 3: the big blind checks its option and every street, spells XL.
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow:
    file: _act.yaml
    env: { ACTION: check-call }
- runFlow: _river.yaml
- tapOn:
    id: "word-builder-tile-X-1"
- tapOn:
    id: "word-builder-tile-L-1"
- runFlow:
    file: _confirm.yaml
    env: { HAND: "3", WORD: XL }
- runFlow:
    file: _results.yaml
    env: { HAND: "3", WORD: DZ }

- runFlow:
    file: _ready.yaml
    env: { SEATS: "3" }
- tapOn:
    id: "hud-leave-button"
- extendedWaitUntil:
    visible: ".*DEAL A NEW TABLE"
    timeout: 30000

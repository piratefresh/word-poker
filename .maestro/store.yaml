url: "${typeof WEB_URL === 'undefined' ? 'http://localhost:8081' : WEB_URL}"
name: Store tab shows the daily bonus, coin packs and tile sets
tags: [web, store]
---
# STO-1045 (1a): the STORE chip and the HUD coin pill open the same tab. It buys nothing.
# Buttons go by their label: on the web an aria-label hides the test id from Maestro.
- runFlow: sign-in.yaml
- tapOn:
    id: "tab-store"
- extendedWaitUntil:
    visible:
      id: "store-daily-bonus"
    timeout: 30000
- assertVisible: "Coins buy tile sets"
- assertNotVisible:
    id: "wallet-error"
- takeScreenshot: store-coins
- tapOn:
    id: "store-tab-tiles"
- assertVisible: "The house set"
- tapOn:
    id: "Buy Jade tiles for 2,500 coins"
- extendedWaitUntil:
    visible: "JADE TILES"
    timeout: 10000
- tapOn: "CANCEL"
- assertNotVisible: "JADE TILES"
- takeScreenshot: store-tiles
- tapOn:
    id: "tab-home"
- assertVisible: "Offline"
- tapOn:
    id: "Wallet, [0-9,]+ coins"
- extendedWaitUntil:
    visible:
      id: "store-daily-bonus"
    timeout: 30000
- tapOn:
    id: "tab-home"
- assertVisible: "Offline"

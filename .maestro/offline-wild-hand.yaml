# The offline Wild table (§44, STO-495): the Power Draw opens over the felt on the deal, the hero
# keeps the first card it is offered, and the hand then plays on to its payout.
#
#   maestro test --platform web .maestro/offline-wild-hand.yaml
#
# Same seed as offline-hand.yaml: the Power Draw rolls from streams of its own, so the initial
# tiles are the Classic hand's; CPU swaps change their later line. The hero is offered, in order,
# Vowel Magnet, Mulligan and Random Wild (`drawOffers(20260919, 0)` in game-rules) — so a
# changed seed or catalog fails at the pick, loudly.
#
# Selectors: the reveal is `power-draw`, each card `power-offer-<id>`, and `power-draw-ready` the
# "CHOOSE ONE POWER" hint that shows once the cards take a tap (each a DOM id on the web, via
# `webTestID`). The action row is reached by id, as in offline-hand.yaml. Sign-in composes the
# same way that flow does.
url: http://localhost:8081/offline?seed=20260919&powers=wild
name: Offline Wild hand — pick a power, play the hand
tags:
  - web
  - offline
  - powers
---
- openLink: http://localhost:8081/offline?seed=20260919&powers=wild

- extendedWaitUntil:
    visible: "TAKE YOUR SEAT"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "TAKE YOUR SEAT"
    file: sign-in.yaml
- openLink: http://localhost:8081/offline?seed=20260919&powers=wild

# The draw opens once the dictionary has loaded and the hand is dealt. The draw's clock is 10 s
# (POWER_DRAW_MS) and a web step here takes about half a second, so the flow taps the first card as
# soon as selection opens (`power-draw-ready`, 0.9 s after the row has a layout) and asserts the
# rest afterwards; a slower flow sees the clock keep the first card for it, and the tap below
# fails on a card that has already gone.
- extendedWaitUntil:
    visible:
      id: "power-offer-vowel_magnet"
    timeout: 90000
# The cards land one by one and take no tap until the row has: the hint is the go-ahead.
- extendedWaitUntil:
    visible:
      id: "power-draw-ready"
    timeout: 5000
- tapOn:
    id: "power-offer-vowel_magnet"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false

# The three CPUs pick on separate 900 ms beats, then pre-flop starts on its clock.
- extendedWaitUntil:
    notVisible:
      id: "power-draw"
    timeout: 5000

# The shipped-dictionary probe pins Mira's Mulligan on its first turn, before its raise.
- extendedWaitUntil:
    visible:
      id: "power-used"
      containsDescendants:
        - text: "MIRA USED"
    timeout: 5000
- assertVisible:
    id: "seat-power-tag-mira"
    containsDescendants:
      - text: "MULLIGAN"

# The seed's pre-flop line, now that the table runs: mira raises the blind to 60.
- extendedWaitUntil:
    visible:
      id: "action-check-call"
      containsDescendants:
        - text: "\\$60"
    timeout: 20000

# Play it out: answer every turn with the row's check-or-call until the hand pays out (§19's
# window closes on its own clock when the hero builds nothing).
- repeat:
    while:
      notVisible:
        text: "PHASE 6 · PAYOUT"
    commands:
      - extendedWaitUntil:
          visible: "YOUR TURN|PHASE 6 · PAYOUT"
          timeout: 70000
          optional: true
      - runFlow:
          when:
            visible: "YOUR TURN"
          commands:
            - tapOn:
                id: "action-check-call"
            - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "HAND #1 · RESULTS"
    timeout: 10000
# Mira's played swap is revealed only here, with §44's marker on the A in DRAGS.
- assertVisible:
    id: "result-card-mira-tile-2-powered"

# The offline Wild table (§44, STO-495): the Power Draw opens over the felt on the deal, the hero
# keeps the first card it is offered, and the hand then plays on to its payout.
#
#   maestro test --platform web .maestro/offline-wild-hand.yaml
#
# Same seed as offline-hand.yaml: the Power Draw rolls from streams of its own, so the deal and
# the bots' line are the Classic hand's. For that seed the hero is offered, in order,
# Vowel Magnet, Mulligan and Random Wild (`drawOffers(20260919, 0)` in game-rules) — so a
# changed seed or catalog fails at the pick, loudly.
#
# Selectors: the reveal is `power-draw`, each card `power-offer-<id>` (a DOM id on the web, via
# `webTestID`). The action row is reached by id, as in offline-hand.yaml. Sign-in composes the
# same way that flow does.
url: http://localhost:8081/offline?seed=20260919&powers=wild
name: Offline Wild hand — pick a power, play the hand
tags:
  - web
  - offline
  - powers
---
- openLink: http://localhost:8081/offline?seed=20260919&powers=wild

- extendedWaitUntil:
    visible: "TAKE YOUR SEAT"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "TAKE YOUR SEAT"
    file: sign-in.yaml
- openLink: http://localhost:8081/offline?seed=20260919&powers=wild

# The pack opens once the dictionary has loaded and the hand is dealt. The draw's clock is 10 s
# (POWER_DRAW_MS) and a web step here takes about half a second, so the flow taps the first card as
# soon as it is up and asserts the rest afterwards; a slower flow sees the clock keep the first
# card for it, and the tap below fails on a card that has already gone.
- extendedWaitUntil:
    visible:
      id: "power-offer-vowel_magnet"
    timeout: 90000
- tapOn:
    id: "power-offer-vowel_magnet"
    retryTapIfNoChange: false

# The pick settles the draw at once (no bot draws): the kept beat plays, the reveal leaves, and
# pre-flop starts on its clock.
- extendedWaitUntil:
    notVisible:
      id: "power-draw"
    timeout: 5000

# The seed's pre-flop line, now that the table runs: mira raises the blind to 60.
- extendedWaitUntil:
    visible:
      id: "action-check-call"
      containsDescendants:
        - text: "\\$60"
    timeout: 20000

# Play it out: answer every turn with the row's check-or-call until the hand pays out (§19's
# window closes on its own clock when the hero builds nothing).
- repeat:
    while:
      notVisible:
        text: "PHASE 6 · PAYOUT"
    commands:
      - extendedWaitUntil:
          visible: "YOUR TURN|PHASE 6 · PAYOUT"
          timeout: 70000
          optional: true
      - runFlow:
          when:
            visible: "YOUR TURN"
          commands:
            - tapOn:
                id: "action-check-call"
            - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "HAND #1 · RESULTS"
    timeout: 10000

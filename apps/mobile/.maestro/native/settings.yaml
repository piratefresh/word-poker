appId: com.wordpoker.wordpoker
name: Account settings open and cancel (native)
tags: [native, settings]
---
- runFlow: _ensure-session.yaml
- tapOn:
    id: "home-account-menu"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Account settings"
    timeout: 10000
- assertVisible:
    id: "account-display-name"
- assertVisible:
    id: "account-save"
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Account settings"
    timeout: 10000
- assertVisible: "Offline"

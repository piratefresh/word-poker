# Online smokes need a real Better Auth session, even on E2E builds.
appId: com.wordpoker.wordpoker
env:
  TEST_USER_EMAIL: e2e@wordpoker.dev
  TEST_USER_PASSWORD: wordpoker-e2e
---
- extendedWaitUntil:
    visible: "TAKE YOUR SEAT"
    timeout: 180000
# Tap the inputs by placeholder: on iOS the label text is a separate, untappable element.
- tapOn: "you@mail.com or HANDLE"
- inputText: ${TEST_USER_EMAIL}
- tapOn: "Your password"
- inputText: ${TEST_USER_PASSWORD}
- hideKeyboard
- tapOn: "TAKE YOUR SEAT"
- extendedWaitUntil:
    visible: "Play Online"
    timeout: 60000
# iOS offers to save the password over the menu after the first sign-in.
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"

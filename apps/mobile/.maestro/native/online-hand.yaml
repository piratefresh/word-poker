# The same seed 409 online hand as .maestro/online-hand.yaml, on a device.
#
# Build/install a development client with real sign-in. The app needs a
# reachable Colyseus server, a seed-enabled server, and the opponent script below. Set
# EXPO_PUBLIC_GAME_URL in the build to an address the device can reach (not localhost on the device).
# Start the opponent and pass the room id printed by smoke-opponent.ts:
#
#   cd apps/mobile
#   eas build --platform android --profile e2e-test
#   maestro test --platform android .maestro/native/online-hand.yaml -e ROOM_ID=the-id-printed-by-smoke-opponent
#
# The device seat is seat 1 at seed 409: rack I, S/L; board Q/K, W, N, B, U; it builds the dictionary
# word ILK from I, L on the S/L choice tile, and K on the Q/K choice tile. A different seed fails at the tile selectors.
#
# A development build instead (scripts/smoke-online-native.mjs): the runner opens the dev client on
# its own Metro first and passes ATTACH=1, so the flow attaches to that running app, not relaunch it.
appId: com.wordpoker.wordpoker
name: Online hand - join, call the blind, build ILK and read results
tags:
  - native
  - online
---
- runFlow:
    when:
      true: ${typeof ATTACH === 'undefined'}
    commands:
      - launchApp
- runFlow:
    when:
      true: ${typeof ATTACH !== 'undefined'}
    commands:
      # The dev menu's first-run sheet sits over the app until dismissed.
      - tapOn:
          text: "Continue"
          optional: true
# A link that lands while the bundle is still loading is dropped, so wait for the home screen.
- extendedWaitUntil:
    visible: "TAKE YOUR SEAT|Online Mode"
    timeout: 180000
- runFlow:
    when:
      visible: "TAKE YOUR SEAT"
    file: _sign-in.yaml
- extendedWaitUntil:
    visible: "Online Mode"
    timeout: 180000
- openLink: wordpoker://online?room=${ROOM_ID}
- extendedWaitUntil:
    visible:
      id: "poker-table"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "action-ready"
      enabled: true
    timeout: 60000

# The opponent has readied itself; ready the device seat to deal the hand.
- tapOn:
    id: "action-ready"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "PREFLOP"
    timeout: 30000

# Maestro's settle limit is best-effort; the runner also bounds the whole process.
# Seed 409 has one hero call/check per street. Reach the river before building the word.
# The native table has no COMMUNITY count label, and RIVER appears before betting closes.
- repeat:
    times: 3
    commands:
      - extendedWaitUntil:
          visible: "YOUR TURN"
          timeout: 40000
      - tapOn:
          id: "action-check-call"
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false

- extendedWaitUntil:
    visible: "RIVER"
    timeout: 40000
- extendedWaitUntil:
    visible: "YOUR TURN"
    timeout: 40000
# Draft while the river betting clock is still running. Drafting is legal throughout the hand,
# and slow Maestro tile taps must not consume the shared 60-second word window.
- tapOn:
    id: "word-builder-tile-I-2"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: "word-builder-face-SL-1-L"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- tapOn:
    id: "word-builder-face-QK-1-K"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- assertVisible:
    text: "ILK"

# Close the river betting round, then confirm the draft from the same control.
- tapOn:
    id: "action-check-call"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "action-fold"
      enabled: false
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "action-check-call"
      enabled: true
    timeout: 20000
- tapOn:
    id: "action-check-call"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
# Results now have a placement/XP or win overlay with its own Continue control.
- extendedWaitUntil:
    visible:
      id: "xp-result-continue|simple-win-continue|results-back"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "xp-result-continue|simple-win-continue"
    commands:
      - tapOn:
          id: "xp-result-continue|simple-win-continue"
          waitToSettleTimeoutMs: 500
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "HAND #1 · RESULTS"
    timeout: 30000
- assertVisible:
    text: "SCOREBOARD"
- assertVisible:
    text: ".*ILK.*"
- assertNotVisible:
    text: "The window closed"
- tapOn:
    id: "results-back"
- waitForAnimationToEnd

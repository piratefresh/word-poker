# The street menu on a device (STO-597): the four mode slabs — Play Online, Play a Friend,
# Tutorial, Offline — sit on the wall left of the door, and the Offline slab opens its two
# choices, Normal and Wild Power.
#
#   maestro test --platform ios .maestro/native/home-menu.yaml        # from apps/mobile
#
# It needs the app past the sign-in guard: the `e2e-test` build (EXPO_PUBLIC_E2E_AUTH_BYPASS=1,
# src/lib/e2e.ts) boots straight to the home tab. Run it on the iPhone 17 simulator and on a
# smaller phone (iPhone SE): the slabs and the door must still fit the short screen.
appId: com.wordpoker.wordpoker
name: Home menu — slabs fit and Offline choices open (native)
tags:
  - native
  - home
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Offline"
    timeout: 60000

# Every mode slab is on the screen.
- assertVisible: "Play Online"
- assertVisible: "Play a Friend"
- assertVisible: "Tutorial"
- assertVisible: "Offline"
- takeScreenshot: home-menu

# The Offline slab opens its choices, each one whole: the tile by testID, then by the label it
# reads out ("<label>: <description>", mode-variants.tsx).
- tapOn:
    id: "home-slab-offline"
- assertVisible:
    id: "offline-normal"
- assertVisible:
    id: "offline-wild"
- assertVisible: "Normal: Standard rules"
- assertVisible: "Wild Power: Pick a power each hand"
- takeScreenshot: home-menu-offline

# Choosing a card updates the deal; dismissing preserves the choice.
- tapOn:
    id: "offline-wild"
- assertVisible: "DEAL · WILD POWER"
- tapOn:
    id: "offline-close"
- assertNotVisible:
    id: "offline-tray"
- tapOn:
    id: "home-slab-offline"
- assertVisible: "DEAL · WILD POWER"

# Normal walks through the door only after DEAL.
- tapOn:
    id: "offline-normal"
- assertVisible: "DEAL · NORMAL"
- tapOn:
    id: "offline-deal"
- extendedWaitUntil:
    visible: "PREFLOP"
    timeout: 90000

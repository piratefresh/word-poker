# The offline hand, played end to end on a build of the app rather than in a browser: deal →
# real betting rounds to the river → a hero BET → draft a word from the rack → call the raise →
# §19's window opens → confirm → §11 judges it → §21 names a winner → next hand.
#
# The same hand as .maestro/offline-hand.yaml (repository root) on the same pinned seed, and a
# second flow on purpose: a flow is a web flow (`url:`) or a device flow (`appId:`), never
# both, and the selectors differ where the platforms do — see the notes below.
#
# This is the copy EAS Workflows runs. It lives beside `eas.json` because that is where an EAS
# job runs: the job's working directory is this app directory (a probe run put it at
# /home/expo/workingdir/build/apps/mobile), so `flow_path` in apps/mobile/.eas/workflows is
# resolved from here and not from the repository root.
#
# Run it locally against a device that already has the app installed:
#
#   maestro test --platform android .maestro/native/offline-hand.yaml      # from apps/mobile
#
# Run it in CI, which builds the app with eas.json's `e2e-test` profile — an .apk for the
# Android emulator, a simulator .app for iOS — and then drives this same flow:
#
#   eas workflow:run .eas/workflows/e2e-android.yml                        # from apps/mobile
#
# The build under test has nothing behind it. The dictionary ships in the bundle (the engine's
# lazy artifact import), the bots run in-process, and the seed the deep link pins is the whole
# of the table's randomness. The one thing a device cannot do without a server is sign in, and
# this route sits behind the sign-in guard — so `e2e-test` sets EXPO_PUBLIC_E2E_AUTH_BYPASS
# (src/lib/e2e.ts) and the guard lets the seat through. No account, no network, no backend.
#
# The pinned seed's personality-policy line (also asserted by game-rules/test/bot.test.ts):
# mira raises preflop to 40, called around; the flop checks through. On the turn Mira bets
# 100, the hero and Ellis call, and Jay folds. The river checks to the hero with pot 460.
# The hero opens for 20, Ellis calls, Mira raises to 480, and the hero calls the remaining 460.
# Ellis calls the raise too; pot 1,900 opens the word window. The hero's Z/A tiles are unchanged.
#
# The CPU plays on a beat of its own — one seat's action per `duration.cpuBeat` — so the table
# between two hero actions moves on its own, and every step that waits for a bot waits for it
# rather than asserting it on the spot.
#
# Selector notes — the native half of the web flow's lesson. A device matches text as a
# whole-string regex and does not fold case, so a selector is what a component prints
# (`CHECK`, `BET $20`, `PREFLOP`), with `$` escaped for the regex. And where the
# felt makes a text selector ambiguous — its seat nameplates print CHECK and CALL as status —
# the flow reaches for a control's testID instead: `action-check-call` walks the round and,
# inside §19's window, is the confirm. Tiles are held by the strip's ids, which are the deal's
# own (`word-builder-tile-<tile id>`); the felt draws copies of the same tiles without one.
appId: com.wordpoker.wordpoker
name: Offline hand — bet, build a word and pay out (native)
tags:
  - native
  - offline
---
- runFlow:
    when:
      true: ${typeof ATTACH === 'undefined'}
    commands:
      - launchApp
- runFlow:
    when:
      true: ${typeof ATTACH !== 'undefined'}
    commands:
      # The runner opened the dev client on its Metro; relaunching would drop that URL.
      - tapOn:
          text: "Continue"
          optional: true
      - runFlow:
          when:
            visible: "Open React Native dev menu"
          commands:
            - back

# On a cold start the root layout renders nothing until the fonts load, and a link that
# lands then is dropped (STO-516): wait for home before sending it.
- extendedWaitUntil:
    visible: "Offline Mode"
    timeout: 30000

# The web flow pins the seed in its URL; a device gets the same route as a deep link. The
# scheme is app.json's `scheme`, so expo-router reads this as /offline?seed=…
# turn= lengthens the 60 s offline clock: a Maestro step can take 10-50 s on the emulator.
- openLink: wordpoker://offline?seed=7578&turn=300000

# The table holds until the dictionary has loaded (the hand is judged against it).
- extendedWaitUntil:
    visible: "PREFLOP"
    timeout: 90000

# Mira raises the blind to 40: a changed seed or table configuration fails here.
- extendedWaitUntil:
    visible:
      id: "action-check-call"
      text: "Call \\$40"
    timeout: 20000

# Follow the seeded betting line directly. Repeated condition checks on the animated table
# can consume the turn clock, and a fold-out must fail at the next street instead of looping.
# Bound tap settling and wait for game state: the clock and Rive art keep moving.
- tapOn:
    id: "action-check-call"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "FLOP"
    timeout: 20000
- extendedWaitUntil:
    visible: "YOUR TURN"
    timeout: 20000
- tapOn:
    id: "action-check-call"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "TURN"
    timeout: 20000
- extendedWaitUntil:
    visible: "YOUR TURN"
    timeout: 20000
- tapOn:
    id: "action-check-call"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "RIVER"
    timeout: 20000

# The hero can open the river. Mira answers with a raise; draft before calling it.
- extendedWaitUntil:
    visible: "YOUR TURN"
    timeout: 20000
- tapOn:
    id: "wager-slider"
    point: "2%,50%"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "action-wager"
    text: "Bet \\$20"
- assertVisible:
    text: "\\$460"
- tapOn:
    id: "action-wager"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "action-check-call"
      text: "Call \\$460"
    timeout: 20000
# Draft before calling the river raise, as in cross-platform-hand.yaml. Slow native taps
# otherwise consume §19's shared 60-second window before the word can be confirmed.
# Build the word out of three tiles the strip holds for the seed the deep link pins. A tap toggles
# a tile where it lies, so the word is the played tiles read left to right, not the order they
# were tapped: Z-1, I-9 and G-1 sit in that order in this deal's strip, and the draft spells ZIG. Those three
# are the deal's own and their word is 14 points — so a changed seed or table configuration
# fails here, loudly, instead of silently playing some other word.
- tapOn:
    id: "word-builder-tile-Z-1"
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "word-builder-tile-I-9"
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "word-builder-tile-G-1"
    waitToSettleTimeoutMs: 500
- assertVisible:
    text: "ZIG"
- assertVisible:
    text: "14 pts"

# Shuffling rearranges the tiles the word does not hold, so the draft stands as built.
- tapOn:
    id: "word-builder-shuffle"
    waitToSettleTimeoutMs: 500
- assertVisible:
    text: "ZIG"
- assertVisible:
    text: "14 pts"

# Calling the raise closes betting; §19 turns the same control into the word confirm.
- tapOn:
    id: "action-check-call"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "\\$1,900"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "action-check-call"
      enabled: true
    timeout: 20000
- tapOn:
    id: "action-check-call"
    waitToSettleTimeoutMs: 500

# Signed-in builds show XP before the results; bypass builds may show the win celebration.
- extendedWaitUntil:
    visible:
      id: "xp-result-continue|simple-win-continue|results-back"
    timeout: 70000
- runFlow:
    when:
      visible:
        id: "xp-result-continue|simple-win-continue"
    commands:
      - tapOn:
          id: "xp-result-continue|simple-win-continue"
          waitToSettleTimeoutMs: 500

# The results sheet follows the payout, and its primary deals the next hand.
- extendedWaitUntil:
    visible: "HAND #1 · RESULTS"
    timeout: 15000
- assertVisible: "4 PLAYERS · 1 FOLD · 3 WORDS PLAYED"
- assertNotVisible: "The window closed"
- assertVisible:
    text: "DEAL ANOTHER"
- tapOn:
    text: "DEAL ANOTHER"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "PREFLOP"
    timeout: 15000
- assertNotVisible:
    text: "HAND #1 · RESULTS"
